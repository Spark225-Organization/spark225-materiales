<script>
// GitHub Pages: manda cualquier ruta a la app (/?/ruta) y la app restaura la dirección real.
(function (l) {
  l.replace(l.protocol + '//' + l.host + '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
})(window.location);
</script></head><body></body></html>
